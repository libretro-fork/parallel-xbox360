# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

# Linux x64, Linux aarch64, Windows x64, Android arm64-v8a and x86_64.
#
# Xenia Edge needs clang 21 and GCC 14's libstdc++; the buildbot's Linux images
# (Ubuntu 16.04, gcc 9) cannot build it, so the Linux jobs run in Ubuntu 22.04
# (glibc 2.35) with clang 21 from apt.llvm.org, as the project's GitHub CI
# does and as cemu-libretro's and vita3k-libretro's jobs do. The core is built
# directly through the checked-in Makefiles, including native embedding tools
# and generated headers. Windows needs a newer MSVC than the buildbot's
# 2019 16.8, so it is cross-built with LLVM (.ci/build-windows-cross.sh). macOS has
# not been tried on the buildbot yet.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

variables:
  # All core sources are part of this repository.
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: "0"

.core-defs:
  variables:
    CORENAME: parallel_xbox360

include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

stages:
  - build-prepare
  - build-shared

# A runner having a bad minute should not redden the pipeline; anything really
# broken still fails three times over.
default:
  retry: 2

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Defining before_script replaces the template's instead of adding to it, so
# its NUMPROC is set again here.
.core-defs-linux:
  extends: .core-defs
  image: ubuntu:22.04
  timeout: 3h
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
      ca-certificates wget gnupg lsb-release software-properties-common
      git file
    - wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
    - apt-add-repository -y --no-update "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main"
    - add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
      clang-21 lld-21 libclang-rt-21-dev llvm-21 g++-14 ninja-build make
      libfontconfig1-dev liblz4-dev
    - export CC=clang-21 CXX=clang++-21
  script:
    - make -j "$NUMPROC" platform=linux-$(uname -m) BUILD_DIR="$BUILD_DIR" HOST_CC="$CC" AR=llvm-ar-21
    - strip --strip-unneeded "$LIBNAME"

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs-linux

# Linux 64-bit (ARM)
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs-linux

# Windows 64-bit
#
# clang-cl and lld-link (LLVM 21) against the MSVC CRT and Windows SDK, which
# the script fetches with xwin, so the core links the same runtime as the
# project's MSVC build. Built-in shader modules are checked in; the current
# guest backend builds Mesa's spirv_to_dxil with the same clang-cl.
# The template's MXE image and steps are not used, only its name and
# artifacts.
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  image: ubuntu:24.04
  timeout: 3h
  variables:
    # The script's tools - the MSVC CRT and Windows SDK, the Python tools it
    # installs, DXC - inside the project, so that GitLab's cache can
    # keep them between pipelines (Craig). The key follows the script, which
    # names the versions.
    XE_CROSS_TOOLS: $CI_PROJECT_DIR/.cross-tools
  cache:
    key:
      files:
        - .ci/build-windows-cross.sh
      prefix: windows-x64
    paths:
      - .cross-tools/msvc/
      - .cross-tools/venv/
      - .cross-tools/dxil.dll
      - .cross-tools/dxil.dll.*
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - BUILD_DIR=$BUILD_DIR NUMPROC=$NUMPROC .ci/build-windows-cross.sh
    - mv "$BUILD_DIR/$LIBNAME" "$LIBNAME"

# Android
#
# Raw shader modules are embedded by the native C89 host tool, which is built
# for the build machine by HOST_CC independently of the NDK compiler. API 28 and the NDK
# the template sets up.
.core-defs-android:
  extends: .core-defs
  timeout: 3h
  variables:
    API_LEVEL: 28
  script:
    - make -j "$NUMPROC" platform=android-$ANDROID_ABI BUILD_DIR="$BUILD_DIR"
      NDK_ROOT="$NDK_ROOT" API_LEVEL="$API_LEVEL"
    - $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded "$LIBNAME"

# Android 64-bit (ARM)
android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs-android

# Android 64-bit (x86)
android-x86_64:
  extends:
    - .libretro-android-cmake-x86_64
    - .core-defs-android
