name: Transfer helper correctness
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools and software Vulkan
        run: sudo apt-get update -qq && sudo apt-get install -y gcc spirv-tools libvulkan1 mesa-vulkan-drivers
      - name: Validate binary and execute exact vertex oracle
        run: |
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name 'lvp*.json' -print -quit)
          test -n "$VK_ICD_FILENAMES"
          GPU_TESTS=1 sh tools/tests/run_transfer_geometry_tests.sh
          GPU_TESTS=1 sh tools/tests/run_transfer_sample_tests.sh
          TRANSFER_UINT_COLOR_TEST=1 GPU_TESTS=1 sh tools/tests/run_transfer_sample_tests.sh
          TRANSFER_ADDRESS_TEST=1 GPU_TESTS=1 sh tools/tests/run_transfer_sample_tests.sh
          GPU_TESTS=1 sh tools/tests/run_transfer_uint_image_tests.sh
          sh tools/tests/run_transfer_uint_bank_tests.sh
          python3 tools/tests/test_transfer_uint_warm_analysis.py
          python3 tools/tests/test_transfer_uint_warm_ci.py
          GPU_TESTS=0 TRANSFER_WARM_PARENT_SOURCE="$PWD" sh tools/tests/run_transfer_uint_warm_tests.sh
          GPU_TESTS=1 sh tools/tests/run_transfer_msaa_image_tests.sh
          MSAA_DYNAMIC_RENDERING=1 GPU_TESTS=1 MSAA_IMAGE_OUT=build/tests/transfer-msaa-dynamic sh tools/tests/run_transfer_msaa_image_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-vulkan-attempt-${{ github.run_attempt }}
          path: |
            build/tests/transfer-geometry/
            build/tests/transfer-sample/
            build/tests/transfer-uint-color/
            build/tests/transfer-address/
            build/tests/transfer-uint-image/
            build/tests/transfer-uint-bank/
            build/tests/transfer-uint-warm/
            build/tests/transfer-msaa-image/
            build/tests/transfer-msaa-dynamic/
          if-no-files-found: error
  d3d12:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build native emitter and execute WARP oracle
        shell: cmd
        run: |
          cmake -S . -B build/windows-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          if errorlevel 1 exit /b 1
          cmake --build build/windows-native --target xenia-native-dxil --parallel 3
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_geometry_tests.cmd
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_sample_tests.cmd
          if errorlevel 1 exit /b 1
          set TRANSFER_UINT_COLOR_TEST=1
          call tools\tests\run_transfer_sample_tests.cmd
          if errorlevel 1 exit /b 1
          set TRANSFER_UINT_COLOR_TEST=0
          set TRANSFER_ADDRESS_TEST=1
          call tools\tests\run_transfer_sample_tests.cmd
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_uint_image_tests.cmd
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_uint_bank_tests.cmd
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_uint_revision_tests.cmd
          if errorlevel 1 exit /b 1
          call tools\tests\run_transfer_msaa_image_tests.cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-d3d12-attempt-${{ github.run_attempt }}
          path: |
            build/tests/transfer-geometry-msvc/
            build/tests/transfer-sample-msvc/
            build/tests/transfer-uint-color-msvc/
            build/tests/transfer-address-msvc/
            build/tests/transfer-uint-image-msvc/
            build/tests/transfer-uint-bank-msvc/
            build/tests/transfer-revision-msvc/
            build/tests/transfer-msaa-image-msvc/
          if-no-files-found: error
