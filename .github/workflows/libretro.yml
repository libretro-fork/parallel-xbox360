name: Build libretro core

# Direct Make builds use owned source and checked-in raw shader binaries.
# The Windows CMake build remains until its guest shader backend is replaced.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all
  push:
    branches: [libretro]
    paths-ignore:
      - '*.md'
      - 'LICENSE'

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # As upstream: clang 21 from apt.llvm.org with GCC 14's libstdc++, on
      # Ubuntu 22.04 for an older glibc
      - name: Setup
        run: |
          UBUNTU_BASE=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository --no-update "deb http://apt.llvm.org/${UBUNTU_BASE}/ llvm-toolchain-${UBUNTU_BASE}-21 main"
          sudo add-apt-repository -y --no-update ppa:ubuntu-toolchain-r/test
          sudo apt-get -y update
          sudo apt-get -y install --no-install-recommends clang-21 lld-21 libclang-rt-21-dev llvm-21
          sudo apt-get -y install g++-14 make libfontconfig1-dev

      - name: Build
        env:
          CC: clang-21
          CXX: clang++-21
        run: make -j$(getconf _NPROCESSORS_ONLN) HOST_CC=clang-21 AR=llvm-ar-21

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro.so dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          strip --strip-unneeded dist/parallel_xbox360_libretro.so
          ls -la dist
          readelf -d dist/parallel_xbox360_libretro.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-linux-${{ matrix.arch }}
          path: dist/

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mesa's spirv_to_dxil, D3D12's shader backend, is built by meson
      - name: Setup
        run: |
          python -m pip install --upgrade meson mako pyyaml packaging

      # Direct3D 12's shader validator, which the D3D12 backend needs and
      # standalone downloads at run time; the core carries it inside instead
      # and writes it to system/Xenia-Edge/D3D12/. From a pinned
      # DirectXShaderCompiler release (MIT).
      - name: dxil.dll
        shell: bash
        run: |
          curl -sSL -o dxc.zip https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip
          mkdir -p dxc
          unzip -p dxc.zip 'bin?x64?dxil.dll' > dxc/dxil.dll
          echo "XENIA_LIBRETRO_DXIL=$GITHUB_WORKSPACE/dxc/dxil.dll" >> $GITHUB_ENV

      - name: Build
        run: |
          $env:XE_VS_PATH = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$env:XE_VS_PATH) { throw 'MSVC installation not found' }
          & cmd /d /c 'call "%XE_VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" && cmake -S . -B build/windows-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl && cmake --build build/windows-native --target xenia-libretro --parallel'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          core=$(find build -name 'parallel_xbox360_libretro.dll' | head -1)
          echo "core: $core"
          cp "$core" dist/parallel_xbox360_libretro.dll
          cp libretro/parallel_xbox360_libretro.info dist/
          ls -la dist
          # The pdb, kept apart: a crash's "parallel_xbox360_libretro.dll+<offset>"
          # in xenia.log resolves against it
          mkdir -p symbols
          pdb=$(find build -name 'parallel_xbox360_libretro.pdb' | head -1)
          [ -n "$pdb" ] && cp "$pdb" symbols/ || echo "no pdb"

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-windows-x86_64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-windows-x86_64-symbols
          path: symbols/
          if-no-files-found: ignore

  # The frontend supplies Vulkan through an external driver. Apple Silicon
  # only: the x64 backend needs the address space
  # below 4 GB, which a dylib can't free (the __PAGEZERO is RetroArch's)
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          brew install make

      - name: Build
        run: gmake -j$(sysctl -n hw.ncpu) platform=macos-arm64

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro.dylib dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          strip -x dist/parallel_xbox360_libretro.dylib
          codesign -f -s - dist/parallel_xbox360_libretro.dylib
          otool -L dist/parallel_xbox360_libretro.dylib
          lipo -info dist/parallel_xbox360_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-macos-${{ matrix.arch }}
          path: dist/

  # Cross-compiled with the NDK; the C89 embedding tool runs on the host.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) platform=android-${{ matrix.abi }} NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro_android.so dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded dist/parallel_xbox360_libretro_android.so
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d dist/parallel_xbox360_libretro_android.so | grep NEEDED
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-android-${{ matrix.abi }}
          path: dist/
