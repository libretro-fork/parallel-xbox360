name: Build libretro core

# Direct Make builds use owned source and checked-in raw shader binaries.
# Windows also checks the native MSVC CMake build.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (linux, windows, android, macos), or all'
        type: string
        default: all
  push:
    branches: [libretro]
    paths-ignore:
      - '*.md'
      - 'LICENSE'

# Test builds can be limited to the platforms their testers use: the
# platforms input (workflow_dispatch) lists them. Pushes and "all" build
# everything.
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GCC 14 on Ubuntu 22.04 retains the older glibc baseline.
      - name: Setup
        run: |
          sudo sh .ci/setup-linux-gcc.sh

      - name: Loader and resolve-owner regressions
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          sh tools/tests/run_pe_tests.sh
          sh tools/tests/run_resolve_owners_tests.sh
          sh tools/tests/run_resolve_owners_reference_tests.sh --check
          sh tools/tests/run_resolve_recent_tests.sh
          sh tools/tests/run_resolve_recent_reference_tests.sh --check
          sh tools/tests/run_resolve_rearm_tests.sh
          sh tools/tests/run_resolve_rearm_reference_tests.sh --check
          sh tools/tests/run_resolve_rearm_threads_tests.sh
          sh tools/tests/run_command_rows_tests.sh
          sh tools/tests/run_vk_barriers_tests.sh
          sh tools/tests/run_layout_ready_tests.sh
          sh tools/tests/run_ready_owned_tests.sh
          sh tools/tests/run_binding_snapshot_tests.sh
          sh tools/tests/run_source_views_tests.sh
          sh tools/tests/run_gpu_uav_tests.sh
          sh tools/tests/run_resolve_dispatch_tests.sh
          sh tools/tests/run_spv_image_sink_tests.sh
          sh tools/tests/run_resolve_address_tests.sh
          sh tools/tests/run_xma_payload_tests.sh
          sh tools/tests/run_state_control_tests.sh
          sh tools/tests/run_vblank_tests.sh
          sh tools/tests/run_heap_state_tests.sh
          sh tools/tests/run_job_pool_tests.sh
          sh tools/tests/run_job_wake_tests.sh
          sh tools/tests/run_gpu_tasks_tests.sh
          sh tools/tests/run_gpu_divide_tests.sh
          sh tools/tests/run_resolve_native_loads_tests.sh
          sh tools/tests/run_disc_tests.sh
          sh tools/tests/run_spv_edges_tests.sh

      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: make -j$(getconf _NPROCESSORS_ONLN) HOST_CC=gcc-14 AR=ar

      - name: Post-build codec and VFS regressions
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          PLATFORM=linux-$(uname -m) sh tools/tests/run_xma_checkpoint_tests.sh
          mkdir -p build/tests/media-fixtures
          ffmpeg -nostdin -v error -y -f lavfi -i 'sine=frequency=997:sample_rate=44100:duration=8' -ac 2 -c:a libmp3lame -b:a 128k build/tests/media-fixtures/stereo.mp3
          ffmpeg -nostdin -v error -y -f lavfi -i 'sine=frequency=701:sample_rate=48000:duration=3' -ac 1 -c:a libmp3lame -b:a 64k build/tests/media-fixtures/mono.mp3
          ffmpeg -nostdin -v error -y -f lavfi -i 'sine=frequency=997:sample_rate=48000:duration=8' -ac 2 -c:a wmav2 -b:a 128k build/tests/media-fixtures/stereo.wma
          sh tools/tests/run_media_audio_tests.sh build/tests/media-fixtures/stereo.mp3 build/tests/media-fixtures/mono.mp3 build/tests/media-fixtures/stereo.wma
          PLATFORM=linux-$(uname -m) sh tools/tests/run_file_probe_tests.sh
          sh tools/tests/run_package_header_unit_tests.sh
          sh tools/tests/run_svod_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_svod_native_tests.sh
          sh tools/tests/run_forward_flow_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_shader_analysis_text_tests.sh
          sh tools/tests/run_shader_call_gpu_tests.sh
          sh tools/tests/run_texture_sampling_tests.sh
          sh tools/tests/run_texture_scale_tests.sh
          sh tools/tests/run_shader_names_tests.sh
          sh tools/tests/run_spv_bindings_tests.sh
          sh tools/tests/run_dxil_forward_flow_tests.sh
          sh tools/tests/run_shader_call_tests.sh
          sh tools/tests/run_shader_loop_tests.sh
          sh tools/tests/run_pointer_unique_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_texture_unique_native_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_shader_loop_native_tests.sh
          PLATFORM=linux-$(uname -m) VERTEX_ADDRESS_SANITIZE=1 sh tools/tests/run_vertex_address_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_load_failure_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_package_header_tests.sh
          sh tools/tests/run_direct_audio_tests.sh
          sh tools/tests/run_pipeline_retire_tests.sh
          sh tools/tests/run_binding_storage_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_ng2_shadow_tests.sh
          sh tools/tests/run_bundle_dependencies_tests.sh
          sh tools/tests/run_float_rtz_tests.sh
          sh tools/tests/run_alu_operand_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_alu_operand_native_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_float_rtz_native_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_float_rtz_gpu_tests.sh
          sh tools/tests/run_binary_slot_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_binary_slot_native_tests.sh
          python3 tools/tests/check_draw_event_sites.py
          sh tools/tests/run_draw_contract_tests.sh
          sh tools/tests/run_mpsc_records_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_queue_services_tests.sh
          sh tools/tests/run_cache_writer_tests.sh
          sh tools/tests/run_cache_file_tests.sh
          sh tools/tests/run_bulk_work_tests.sh
          sh tools/tests/run_pipeline_publication_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_pipeline_publication_native_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_native_binding_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_binding_translate_tests.sh
          sh tools/tests/run_texture_dirty_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_texture_dirty_native_tests.sh
          sh tools/tests/run_apu_clients_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_apu_client_system_tests.sh
          AUDIO_STATE_ALLOC_TEST=1 PLATFORM=linux-$(uname -m) sh tools/tests/run_audio_driver_state_tests.sh
          PLATFORM=linux-$(uname -m) sh tools/tests/run_xma_decoder_state_tests.sh
          DECODER_STATE_OPEN_FAILURE_TEST=1 DECODER_STATE_OUT=build/tests/xma-open-failure PLATFORM=linux-$(uname -m) sh tools/tests/run_xma_decoder_state_tests.sh

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro.so dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          strip --strip-unneeded dist/parallel_xbox360_libretro.so
          ls -la dist
          readelf -d dist/parallel_xbox360_libretro.so | grep NEEDED

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-linux-${{ matrix.arch }}
          path: dist/

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          $env:XE_VS_PATH = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$env:XE_VS_PATH) { throw 'MSVC installation not found' }
          & cmd /d /c 'call "%XE_VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" && call tools\tests\run_shader_call_tests.cmd && call tools\tests\run_float_rtz_tests.cmd && call tools\tests\run_alu_operand_tests.cmd && call tools\tests\run_pe_tests.cmd && call tools\tests\run_resolve_owners_tests.cmd && call tools\tests\run_resolve_owners_reference_tests.cmd --check && call tools\tests\run_resolve_recent_tests.cmd && call tools\tests\run_resolve_recent_reference_tests.cmd --check && call tools\tests\run_resolve_rearm_tests.cmd && call tools\tests\run_resolve_rearm_reference_tests.cmd --check && call tools\tests\run_resolve_rearm_threads_tests.cmd && call tools\tests\run_command_rows_tests.cmd && call tools\tests\run_d3d12_barrier_tests.cmd && call tools\tests\run_vk_barriers_tests.cmd && call tools\tests\run_source_views_tests.cmd && call tools\tests\run_gpu_uav_tests.cmd && call tools\tests\run_resolve_dispatch_tests.cmd && call tools\tests\run_spv_image_sink_tests.cmd && call tools\tests\run_resolve_address_tests.cmd && call tools\tests\run_xma_payload_tests.cmd && call tools\tests\run_state_control_tests.cmd && call tools\tests\run_vblank_tests.cmd && call tools\tests\run_heap_state_tests.cmd && call tools\tests\run_job_pool_tests.cmd && call tools\tests\run_job_wake_tests.cmd && call tools\tests\run_gpu_tasks_tests.cmd && call tools\tests\run_gpu_divide_tests.cmd && call tools\tests\run_resolve_native_loads_tests.cmd && call tools\tests\run_resolve_loads_emit_tests.cmd && call tools\tests\run_disc_tests.cmd && call tools\tests\run_spv_edges_tests.cmd && cmake -S . -B build/windows-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl && cmake --build build/windows-native --target xenia-libretro --parallel && call tools\tests\run_xma_checkpoint_tests.cmd && call tools\tests\run_file_probe_tests.cmd && call tools\tests\run_package_header_tests.cmd && call tools\tests\run_svod_native_tests.cmd && call tools\tests\run_ng2_shadow_tests.cmd && call tools\tests\run_float_rtz_native_tests.cmd && call tools\tests\run_alu_operand_native_tests.cmd && call tools\tests\run_float_rtz_gpu_tests.cmd && call tools\tests\run_binary_slot_native_tests.cmd && call tools\tests\run_forward_flow_tests.cmd && call tools\tests\run_shader_analysis_text_tests.cmd && call tools\tests\run_shader_call_gpu_tests.cmd && call tools\tests\run_texture_sampling_tests.cmd && call tools\tests\run_texture_scale_tests.cmd && call tools\tests\run_shader_names_tests.cmd && call tools\tests\run_spv_bindings_tests.cmd && call tools\tests\run_dxil_forward_flow_tests.cmd && call tools\tests\run_shader_loop_native_tests.cmd && call tools\tests\run_vertex_address_tests.cmd && call tools\tests\run_texture_unique_native_tests.cmd && call tools\tests\run_load_failure_tests.cmd && call tools\tests\run_xma_decoder_state_tests.cmd && set "DECODER_STATE_OPEN_FAILURE_TEST=1" && set "DECODER_STATE_OUT=build\tests\xma-open-failure-msvc" && call tools\tests\run_xma_decoder_state_tests.cmd && call tools\tests\run_direct_audio_tests.cmd && call tools\tests\run_audio_driver_state_tests.cmd && call tools\tests\run_apu_clients_tests.cmd && call tools\tests\run_apu_client_system_tests.cmd && call tools\tests\run_texture_dirty_tests.cmd && call tools\tests\run_texture_dirty_native_tests.cmd && call tools\tests\run_pipeline_retire_tests.cmd && call tools\tests\run_binding_storage_tests.cmd && call tools\tests\run_native_binding_tests.cmd && python tools\tests\check_draw_event_sites.py && call tools\tests\run_layout_ready_tests.cmd && call tools\tests\run_ready_owned_tests.cmd && call tools\tests\run_binding_snapshot_tests.cmd && call tools\tests\run_binding_translate_tests.cmd && call tools\tests\run_geometry_owned_tests.cmd && call tools\tests\run_draw_contract_tests.cmd && call tools\tests\run_draw_translate_tests.cmd && call tools\tests\run_mpsc_records_tests.cmd && call tools\tests\run_queue_services_tests.cmd && call tools\tests\run_cache_writer_tests.cmd && call tools\tests\run_bulk_work_tests.cmd && call tools\tests\run_pipeline_publication_tests.cmd && call tools\tests\run_pipeline_publication_native_tests.cmd'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Draw-path stats profile (test-only core)
        run: |
          $env:XE_VS_PATH = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$env:XE_VS_PATH) { throw 'MSVC installation not found' }
          $env:XE_DRAW_JOBS = [string][Math]::Max(1, [Math]::Min(5, [Math]::Floor([Environment]::ProcessorCount / 2)))
          & cmd /d /c 'call "%XE_VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" && call tools\tests\run_draw_profile_tests.cmd build\windows-native\bin\Windows\parallel_xbox360_libretro.dll release && cmake -S . -B build/windows-draw-stats -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DXENIA_ENABLE_DRAW_STATS=ON -DXENIA_ENABLE_LTO=OFF && cmake --build build/windows-draw-stats --target xenia-libretro --parallel %XE_DRAW_JOBS% && call tools\tests\run_draw_profile_tests.cmd build\windows-draw-stats\bin\Windows\parallel_xbox360_libretro.dll stats'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          core=build/windows-native/bin/Windows/parallel_xbox360_libretro.dll
          echo "core: $core"
          cp "$core" dist/parallel_xbox360_libretro.dll
          cp libretro/parallel_xbox360_libretro.info dist/
          ls -la dist
          # The pdb, kept apart: a crash's "parallel_xbox360_libretro.dll+<offset>"
          # in the frontend crash report resolves against it
          mkdir -p symbols
          pdb=build/windows-native/bin/Windows/parallel_xbox360_libretro.pdb
          [ -f "$pdb" ] && cp "$pdb" symbols/ || echo "no pdb"

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-windows-x86_64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-windows-x86_64-symbols
          path: symbols/
          if-no-files-found: ignore

  # The frontend supplies Vulkan through an external driver. Apple Silicon
  # only: the x64 backend needs the address space
  # below 4 GB, which a dylib can't free (the __PAGEZERO is RetroArch's)
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        run: |
          brew install make

      - name: Build
        run: gmake -j$(sysctl -n hw.ncpu) platform=macos-arm64

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro.dylib dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          strip -x dist/parallel_xbox360_libretro.dylib
          codesign -f -s - dist/parallel_xbox360_libretro.dylib
          otool -L dist/parallel_xbox360_libretro.dylib
          lipo -info dist/parallel_xbox360_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-macos-${{ matrix.arch }}
          path: dist/

  # Cross-compiled with the NDK; the C89 embedding tool runs on the host.
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          make -j$(getconf _NPROCESSORS_ONLN) platform=android-${{ matrix.abi }} NDK_ROOT="$ANDROID_NDK_LATEST_HOME"

      - name: Collect
        run: |
          mkdir -p dist
          cp parallel_xbox360_libretro_android.so dist/
          cp libretro/parallel_xbox360_libretro.info dist/
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded dist/parallel_xbox360_libretro_android.so
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d dist/parallel_xbox360_libretro_android.so | grep NEEDED
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: parallel_xbox360_libretro-android-${{ matrix.abi }}
          path: dist/
